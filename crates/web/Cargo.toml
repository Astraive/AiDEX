[package]
name = "aidex-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aidex-core = { path = "../core" }
aidex-drive = { path = "../drive" }
aidex-events = { path = "../events" }
aidex-policy = { path = "../policy" }
aidex-tools = { path = "../tools" }
aidex-vault = { path = "../vault" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
aidex-workspace = { path = "../workspace" }

[lints]
workspace = true
