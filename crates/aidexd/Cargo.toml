[package]
name = "aidexd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aidex-context = { path = "../context" }
aidex-extensions = { path = "../extensions" }
aidex-web = { path = "../web" }
aidex-tools = { path = "../tools" }
aidex-native-sessions = { path = "../native-sessions" }
aidex-adapters = { path = "../adapters" }
aidex-sandbox = { path = "../sandbox" }
aidex-preferences = { path = "../preferences" }
aidex-inference = { path = "../inference" }
aidex-auth = { path = "../auth" }
aidex-core = { path = "../core" }
aidex-sessions = { path = "../sessions" }
aidex-harness = { path = "../harness" }
aidex-drive = { path = "../drive" }
aidex-events = { path = "../events" }
aidex-host = { path = "../host" }
aidex-providers = { path = "../providers" }
aidex-router = { path = "../router" }
aidex-updater = { path = "../updater" }
aidex-vault = { path = "../vault" }
aidex-workspace = { path = "../workspace" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Signed test bundles (keys generated at run time).
aidex-bundle = { path = "../bundle", features = ["archive", "dev-trust"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "aidexd"
path = "src/main.rs"
