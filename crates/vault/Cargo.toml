[package]
name = "aidex-vault"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Development and test only: `testing::fail_next_write` injects filesystem failures
# (for example an uncertain header commit). Enabled only through dependents'
# dev-dependencies, so release builds never contain it.
test-hooks = []

[dependencies]
aidex-core = { path = "../core" }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.5"
zeroize = "1.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
