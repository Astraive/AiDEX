[package]
name = "aidex-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aidex-bundle = { path = "../bundle" }
aidex-context = { path = "../context" }
aidex-core = { path = "../core" }
aidex-drive = { path = "../drive" }
aidex-events = { path = "../events" }
aidex-host = { path = "../host" }
aidex-inference = { path = "../inference" }
aidex-providers = { path = "../providers" }
aidex-router = { path = "../router" }
aidex-sessions = { path = "../sessions" }
aidex-skills = { path = "../skills" }
aidex-updater = { path = "../updater" }
aidex-workspace = { path = "../workspace" }
aidexd = { path = "../aidexd" }
clap.workspace = true
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.7"

[dev-dependencies]
# Test builds trust keys from AIDEX_DEV_TRUSTED_KEYS (generated at run time).
aidex-bundle = { path = "../bundle", features = ["archive", "dev-trust"] }
aidex-vault = { path = "../vault" }
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "aidex"
path = "src/main.rs"
