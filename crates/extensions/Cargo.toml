[package]
name = "aidex-extensions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aidex-core = { path = "../core" }
aidex-drive = { path = "../drive" }
aidex-events = { path = "../events" }
aidex-policy = { path = "../policy" }
aidex-tools = { path = "../tools" }
aidex-sandbox = { path = "../sandbox" }
aidex-vault = { path = "../vault" }
aidex-workspace = { path = "../workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.8"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
