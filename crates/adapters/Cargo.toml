[package]
name = "aidex-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aidex-core = { path = "../core" }
aidex-auth = { path = "../auth" }
aidex-events = { path = "../events" }
aidex-providers = { path = "../providers" }
aidex-sandbox = { path = "../sandbox" }
aidex-native-sessions = { path = "../native-sessions" }
aidex-vault = { path = "../vault" }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.3"

[lints]
workspace = true
