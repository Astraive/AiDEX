[workspace]
resolver = "2"
members = [
    "crates/aidexd",
    "crates/aidex-cli",
    "crates/adapters",
    "crates/auth",
    "crates/broker",
    "crates/bundle",
    "crates/launcher",
    "crates/mcp",
    "crates/packager",
    "crates/core",
    "crates/context",
    "crates/drive",
    "crates/events",
    "crates/host",
    "crates/inference",
    "crates/policy",
    "crates/preferences",
    "crates/providers",
    "crates/router",
    "crates/sandbox",
    "crates/sessions",
    "crates/skills",
    "crates/native-sessions",
    "crates/plugins",
    "crates/tools",
    "crates/harness",
    "crates/storage",
    "crates/updater",
    "crates/vault",
    "crates/web",
    "crates/workspace",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
