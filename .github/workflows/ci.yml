name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select runtime fixture interpreter
        shell: bash
        run: python -c 'import os, sys; open(os.environ["GITHUB_ENV"], "a").write("AIDEX_TEST_PYTHON=" + sys.executable + "\n")'

      # rust-toolchain.toml selects stable with the minimal profile, so the
      # lint components must be installed explicitly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          # macOS /var is a symlink; use the real runner directory so strict
          # source-path tests exercise managed paths rather than host aliases.
          TMPDIR: ${{ runner.temp }}
        run: cargo test --workspace --no-fail-fast

  apps:
    name: Apps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # One target directory shared by both Tauri crates.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> ../../../target/tauri
            apps/installer/src-tauri -> ../../../target/tauri

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check shared packages
        run: |
          bun run --cwd packages/ui check
          bun run --cwd packages/client check

      - name: Build desktop frontend
        run: bun run --cwd apps/desktop build

      - name: Test desktop frontend
        run: bun run --cwd apps/desktop test

      - name: Build installer frontend
        run: bun run --cwd apps/installer build

      - name: Format Tauri crates
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path apps/installer/src-tauri/Cargo.toml -- --check

      - name: Clippy desktop backend
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Clippy installer backend
        run: cargo clippy --manifest-path apps/installer/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test desktop backend
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-fail-fast

      - name: Test installer backend
        run: cargo test --manifest-path apps/installer/src-tauri/Cargo.toml --locked --no-fail-fast
